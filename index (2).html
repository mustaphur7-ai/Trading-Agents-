<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingAgents-Lite</title>
<style>
:root{--bg:#06080f;--pn:#0b1018;--ln:#1a2233;--tx:#d7deea;--mu:#7d889c;--up:#26d07c;--dn:#ff5c6c;--ac:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln);background:var(--pn)}
h1{font-size:15px;margin:0 8px 0 0}h1 span{color:var(--ac)}
select,input,button{background:#111a2e;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font:inherit}
input{flex:1;min-width:150px}
button{cursor:pointer;font-weight:700}
#run{background:var(--ac);color:#04111f;border:0}
button:disabled{opacity:.5}
.wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;padding:10px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.card h2{margin:0;padding:8px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--ln);display:flex;justify-content:space-between}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 170px}
#cb{height:400px;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
#wl{border-left:1px solid var(--ln);max-height:400px;overflow-y:auto}
.w{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:7px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid #111826}
.w:hover,.w.on{background:#131c2e}
.u{color:var(--up)}.d{color:var(--dn)}
#dec{padding:12px;display:none}
#dec .a{font-size:26px;font-weight:800}
#dec .r{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0;color:var(--mu)}
#dec b{color:var(--tx)}
.nt{padding:8px 12px;color:var(--mu);font-size:11px}
#term{height:480px;overflow-y:auto;padding:10px 12px;font:12px/1.55 ui-monospace,Menlo,monospace;background:#05070b}
.ln{margin:0 0 5px;white-space:pre-wrap;word-break:break-word}
.ln b{display:inline-block;min-width:120px}
.tc{color:#4da3ff}.vc{color:#b48cff}.sc{color:#f5a623}.bu{color:var(--up)}.be{color:var(--dn)}.rm{color:#ffd166}.mt{color:var(--mu)}
#pg{padding:8px 12px;border-top:1px solid var(--ln);font:11px ui-monospace,monospace;background:#05070b}
.pr{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;margin:2px 0}
.bar{height:8px;background:#122018;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--up);transition:width .4s}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.cr{grid-template-columns:1fr}#wl{border-left:0;border-top:1px solid var(--ln);max-height:230px}#cb{height:320px}}
</style>
</head>
<body>
<header>
  <h1>Trading<span>Agents</span>-Lite</h1>
  <select id="sym"></select>
  <select id="tf"><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select>
  <input id="key" type="password" placeholder="Anthropic API key (stays in this browser)">
  <button id="run">Run agents</button>
  <button id="demo">Demo</button>
</header>
<div class="wrap">
  <div>
    <div class="card"><h2><span id="ttl">Chart</span><span id="st" class="mt"></span></h2>
      <div class="cr"><div id="cb"><canvas id="cv"></canvas></div><div id="wl"></div></div>
    </div>
    <div class="card" style="margin-top:10px"><h2>Final decision</h2>
      <div id="dec"></div><div class="nt" id="dn">Run the agents (or Demo) to get a decision.</div>
    </div>
  </div>
  <div class="card"><h2><span>Agent terminal</span><span class="mt">● paper</span></h2>
    <div id="term"></div>
    <div id="pg"></div>
    <div class="nt">Research and paper-trading only. Not financial advice.</div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), MODEL="claude-sonnet-5-5";
const WL=[["PAXGUSDT","Gold (PAXG)"],["BTCUSDT","BTCUSDT"],["ETHUSDT","ETHUSDT"],["BNBUSDT","BNBUSDT"],["SOLUSDT","SOLUSDT"],["XRPUSDT","XRPUSDT"],["DOGEUSDT","DOGEUSDT"]];
const BASE={PAXGUSDT:4190,BTCUSDT:83000,ETHUSDT:2480,BNBUSDT:745,SOLUSDT:108,XRPUSDT:1.38,DOGEUSDT:.06};
const SEC={"15m":900,"1h":3600,"4h":14400,"1d":86400};
const S={cs:[],lines:[],marks:[],demo:false,tok:0,busy:false,tick:{}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fp=p=>p==null||isNaN(p)?"–":p>=100?(+p).toFixed(2):p>=1?(+p).toFixed(3):(+p).toFixed(4);
const gj=async u=>{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};

$("#sym").innerHTML=WL.map(w=>`<option value="${w[0]}">${w[1]}</option>`).join("");
try{$("#key").value=localStorage.getItem("ta_key")||""}catch{}

/* ---------- data (never leaves the chart blank) ---------- */
function synth(sym,tf){
  let p=BASE[sym]||100,seed=sym.length*97+tf.length,t=Math.floor(Date.now()/1000/SEC[tf])*SEC[tf]-199*SEC[tf];
  const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,out=[];
  for(let i=0;i<200;i++){const o=p,c=o*(1+(rnd()-.5)*.012),h=Math.max(o,c)*(1+rnd()*.004),l=Math.min(o,c)*(1-rnd()*.004);out.push({t:t+i*SEC[tf],o,h,l,c,v:100+rnd()*900});p=c}
  return out;
}
async function getCandles(sym,tf){
  const bar={"15m":"15m","1h":"1H","4h":"4H","1d":"1D"}[tf];
  const srcs=[
    async()=>(await gj(`https://data-api.binance.vision/api/v3/klines?symbol=${sym}&interval=${tf}&limit=200`)).map(k=>({t:k[0]/1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})),
    async()=>(await gj(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${tf}&limit=200`)).map(k=>({t:k[0]/1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})),
    async()=>(await gj(`https://www.okx.com/api/v5/market/candles?instId=${sym.replace("USDT","-USDT")}&bar=${bar}&limit=200`)).data.reverse().map(k=>({t:k[0]/1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}))
  ];
  for(const f of srcs){try{const cs=await f();if(cs.length>50)return{cs,demo:false}}catch{}}
  return{cs:synth(sym,tf),demo:true};
}
async function load(){
  const sym=$("#sym").value,tf=$("#tf").value;
  S.lines=[];S.marks=[];
  const r=await getCandles(sym,tf);S.cs=r.cs;S.demo=r.demo;
  $("#ttl").textContent=`${sym} · ${tf}`;
  $("#st").innerHTML=r.demo?'<span class="d">● sample data (live feed unreachable)</span>':'<span class="u">● live</span>';
  draw();wlRender();
}
async function wlLoad(){
  try{const q=encodeURIComponent(JSON.stringify(WL.map(w=>w[0])));
    const r=await gj(`https://data-api.binance.vision/api/v3/ticker/24hr?symbols=${q}`);
    S.tick=Object.fromEntries(r.map(o=>[o.symbol,[+o.lastPrice,+o.priceChangePercent]]));
  }catch{}
  wlRender();
}
function wlRender(){
  const cur=$("#sym").value,last=S.cs.length&&!S.demo?S.cs[S.cs.length-1].c:null;
  $("#wl").innerHTML=WL.map(([s,n])=>{
    const t=S.tick[s],p=s===cur&&last?last:t?t[0]:null,c=t?t[1]:null;
    return `<div class="w ${s===cur?"on":""}" data-s="${s}"><span>${n}</span><span>${fp(p)}</span><span class="${c>=0?"u":"d"}">${c==null?"–":c.toFixed(2)+"%"}</span></div>`}).join("");
  document.querySelectorAll(".w").forEach(e=>e.onclick=()=>{$("#sym").value=e.dataset.s;load()});
}

/* ---------- indicators ---------- */
const ema=(a,n)=>{const k=2/(n+1);let p=a[0];return a.map(v=>p=v*k+p*(1-k))};
function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>=0?g+=d:l-=d}g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}
  return l===0?100:100-100/(1+g/l)}
function atr(cs,n=14){let a=0;for(let i=1;i<cs.length;i++){const tr=Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c));a=i<=n?a+tr/n:(a*(n-1)+tr)/n}return a}
function snap(){
  const cs=S.cs,c=cs.map(x=>x.c),L=cs[cs.length-1],r=cs.slice(-20),f=x=>x.toFixed(2);
  const va=cs.slice(-50).reduce((s,x)=>s+x.v,0)/50;
  return{ema9:ema(c,9).at(-1),ema21:ema(c,21).at(-1),ema50:ema(c,50).at(-1),rsi:rsi(c),atr:atr(cs),hi:Math.max(...r.map(x=>x.h)),lo:Math.min(...r.map(x=>x.l)),vr:L.v/va,last:L.c,
    text:`Symbol ${$("#sym").value} ${$("#tf").value}\nClose ${f(L.c)} | EMA9 ${f(ema(c,9).at(-1))} | EMA21 ${f(ema(c,21).at(-1))} | EMA50 ${f(ema(c,50).at(-1))}\nRSI14 ${f(rsi(c))} | ATR14 ${f(atr(cs))}\n20-bar high ${f(Math.max(...r.map(x=>x.h)))} | low ${f(Math.min(...r.map(x=>x.l)))}\nLast volume vs 50-bar avg: ${(L.v/va).toFixed(2)}x\nLast 8 closes: ${c.slice(-8).map(f).join(", ")}`};
}

/* ---------- canvas chart ---------- */
function draw(){
  const cv=$("#cv"),b=$("#cb"),W=b.clientWidth,H=b.clientHeight,dp=devicePixelRatio||1;
  cv.width=W*dp;cv.height=H*dp;const x=cv.getContext("2d");x.scale(dp,dp);x.font="11px system-ui";
  const N=Math.min(110,S.cs.length);if(!N)return;
  const cs=S.cs.slice(-N),cl=S.cs.map(k=>k.c),e=[9,21,50].map(n=>ema(cl,n).slice(-N));
  const PW=64,PB=22,w=W-PW,h=H-PB;
  let hi=Math.max(...cs.map(k=>k.h)),lo=Math.min(...cs.map(k=>k.l));
  S.lines.forEach(l=>{hi=Math.max(hi,l.p);lo=Math.min(lo,l.p)});
  const pad=(hi-lo)*.08;hi+=pad;lo-=pad;
  const X=i=>(i+.5)*w/N,Y=p=>h-(p-lo)/(hi-lo)*h,bw=Math.max(1,w/N*.62);
  x.fillStyle="#0b1018";x.fillRect(0,0,W,H);
  x.strokeStyle="#151c2e";x.fillStyle="#7d889c";x.textAlign="left";
  for(let i=0;i<=5;i++){const p=lo+(hi-lo)*i/5,y=Y(p);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();x.fillText(fp(p),w+6,y+4)}
  const tf=$("#tf").value;x.textAlign="center";
  for(let i=1;i<5;i++){const k=Math.floor(N*i/5),d=new Date(cs[k].t*1000);x.fillText(tf==="1d"?d.toLocaleDateString([],{month:"short",day:"numeric"}):d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),X(k),H-6)}
  /* EMA ribbon */
  x.beginPath();e[0].forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  for(let i=N-1;i>=0;i--)x.lineTo(X(i),Y(e[2][i]));x.closePath();
  x.fillStyle=e[0][N-1]>=e[2][N-1]?"rgba(38,208,124,.10)":"rgba(255,92,108,.10)";x.fill();
  [["#f5a623",0],["#b48cff",1],["#4da3ff",2]].forEach(([c,j])=>{x.beginPath();x.strokeStyle=c;x.lineWidth=1;e[j].forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke()});
  /* candles */
  cs.forEach((k,i)=>{const c=k.c>=k.o?"#26d07c":"#ff5c6c";x.strokeStyle=x.fillStyle=c;x.lineWidth=1;
    x.beginPath();x.moveTo(X(i),Y(k.h));x.lineTo(X(i),Y(k.l));x.stroke();
    x.fillRect(X(i)-bw/2,Math.min(Y(k.o),Y(k.c)),bw,Math.max(1,Math.abs(Y(k.o)-Y(k.c))))});
  /* last price */
  const lp=cs[N-1].c,ly=Y(lp);x.setLineDash([2,3]);x.strokeStyle="#4da3ff";x.beginPath();x.moveTo(0,ly);x.lineTo(w,ly);x.stroke();x.setLineDash([]);
  tag(x,fp(lp),w,ly,"#2a6fd1",PW);
  /* SL / TP / entry */
  S.lines.forEach(l=>{const y=Y(l.p);x.setLineDash([6,4]);x.strokeStyle=l.c;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();x.setLineDash([]);
    tag(x,l.n+" "+fp(l.p),w-4,y,l.c,PW+4,"right")});
  /* Long / Short markers */
  S.marks.forEach(m=>{const i=cs.findIndex(k=>k.t===m.t);if(i<0)return;const up=m.side==="BUY",px=X(i),py=up?Y(cs[i].l)+22:Y(cs[i].h)-22;
    x.fillStyle=up?"#1c9d9a":"#e5604d";const t=up?"Long":"Short",tw=x.measureText(t).width+14;
    x.beginPath();x.roundRect?x.roundRect(px-tw/2,py-10,tw,20,4):x.rect(px-tw/2,py-10,tw,20);x.fill();
    x.fillStyle="#fff";x.textAlign="center";x.fillText(t,px,py+4)});
}
function tag(x,t,px,y,c,w,al){x.fillStyle=c;const tw=x.measureText(t).width+10;const lx=al==="right"?px-tw+4:px;x.fillRect(lx,y-9,tw,18);x.fillStyle="#fff";x.textAlign="left";x.fillText(t,lx+5,y+4)}

/* ---------- terminal ---------- */
function log(agent,cls,text){
  const d=document.createElement("div");d.className="ln";
  const b=document.createElement("b");b.className=cls;b.textContent=agent;
  d.append(b,document.createTextNode(text));
  $("#term").appendChild(d);$("#term").scrollTop=1e9;
}
const STAGES=["analyst team","bull vs bear debate","risk review"];
function prog(i,pct){
  if(!$("#pg").children.length)$("#pg").innerHTML=STAGES.map(s=>`<div class="pr"><span>• ${s}</span><div class="bar"><i></i></div><span>0%</span></div>`).join("");
  const r=$("#pg").children[i];r.querySelector("i").style.width=pct+"%";r.lastElementChild.textContent=pct+"%";
}
function reset(){$("#term").innerHTML="";$("#pg").innerHTML="";$("#dec").style.display="none";$("#dn").style.display="block";S.lines=[];S.marks=[];S.tok=0;draw()}

function showDecision(d){
  const a=String(d.action||"HOLD").toUpperCase(),col=a==="BUY"?"var(--up)":a==="SELL"?"var(--dn)":"var(--mu)";
  $("#dec").innerHTML=`<div class="a" style="color:${col}">${a==="BUY"?"LONG":a==="SELL"?"SHORT":"HOLD"}</div><div class="r"><span>Confidence <b>${Math.round((d.confidence||0)*100)}%</b></span><span>Entry <b>${fp(d.entry)}</b></span><span>Stop <b>${fp(d.stop_loss)}</b></span><span>Target <b>${fp(d.take_profit)}</b></span></div><div></div>`;
  $("#dec").lastElementChild.textContent=d.rationale||"";
  $("#dec").style.display="block";$("#dn").style.display="none";
  S.lines=[["entry","#4da3ff"],["stop_loss","#ff5c6c"],["take_profit","#26d07c"]].filter(([k])=>d[k]!=null&&!isNaN(d[k])).map(([k,c])=>({n:k==="stop_loss"?"SL":k==="take_profit"?"TP":"Entry",p:+d[k],c}));
  S.marks=a==="HOLD"?[]:[{t:S.cs[S.cs.length-1].t,side:a}];
  draw();
}

/* ---------- live pipeline (Anthropic API) ---------- */
async function ask(system,user,max=300){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":$("#key").value.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:max,system,messages:[{role:"user",content:user}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||"API error "+r.status);
  S.tok+=(j.usage?.input_tokens||0)+(j.usage?.output_tokens||0);
  return j.content.filter(b=>b.type==="text").map(b=>b.text).join("").trim();
}
const RULES="Use only the data given; invent no numbers. Max 35 words. End with: Stance: BULLISH, BEARISH or NEUTRAL.";
async function live(){
  const sn=snap(),T=sn.text;
  log("$ tradingagents","mt","");
  log("✓ model","mt",MODEL);log("✓ data","mt",`${$("#sym").value} ${$("#tf").value} · ${S.demo?"sample":"live"} candles`);
  const mk=(n,c,r)=>ask(`You are the ${r}. ${RULES}`,T).then(t=>{log(n,c,t);return t});
  const [a,b,c]=await Promise.all([mk("technical","tc","technical analyst: trend and momentum"),mk("volatility","vc","volatility and volume analyst"),mk("structure","sc","market-structure analyst: key levels, ranges, breakouts")]);
  prog(0,100);const brief=`TECH:\n${a}\n\nVOL:\n${b}\n\nSTRUCTURE:\n${c}`;
  const bull=await ask("You are the bull researcher. Strongest evidence-based case to BUY. Max 45 words.",`${T}\n\n${brief}`);log("bull researcher","bu",bull);
  const bear=await ask("You are the bear researcher. Strongest case to SELL or stay out; rebut the bull. Max 45 words.",`${T}\n\n${brief}\n\nBULL:\n${bull}`);log("bear researcher","be",bear);
  const ver=await ask("You are the research manager. Pick the more convincing side and name the 2 biggest risks. Max 45 words.",`${brief}\n\nBULL:\n${bull}\n\nBEAR:\n${bear}`);log("research manager","rm",ver);prog(1,100);
  const plan=await ask("You are the trader. Give direction (BUY/SELL/HOLD), entry, stop loss, take profit, using ATR for distances. Max 45 words.",`${T}\n\nVERDICT:\n${ver}`);log("trader","sc",plan);
  const risk=await Promise.all([["aggressive","favour the trade and bigger size"],["neutral","weigh reward vs risk evenly"],["conservative","prioritise capital protection"]].map(([n,s])=>ask(`You are the ${n} risk analyst; you ${s}. Critique the plan in max 30 words.`,plan,200).then(t=>{log(n+" risk","rm",t);return n+": "+t})));
  prog(2,100);
  const raw=await ask('You are the portfolio manager. Reply with ONLY JSON: {"action":"BUY|SELL|HOLD","confidence":0-1,"entry":number|null,"stop_loss":number|null,"take_profit":number|null,"rationale":"1-2 sentences"}',`PLAN:\n${plan}\n\nRISK:\n${risk.join("\n")}`,300);
  let d;try{d=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch{d={action:"HOLD",confidence:0,rationale:"Could not parse the reply; defaulting to HOLD."}}
  log("portfolio mgr","bu",JSON.stringify(d));showDecision(d);
  log("agent graph done ✓","mt",`tokens ${(S.tok/1000).toFixed(1)}k`);
}

/* ---------- demo pipeline (no key needed, uses real indicator maths) ---------- */
async function demo(){
  const s=snap(),bull=s.ema9>s.ema21,sell=!bull,z=700;
  const sym=$("#sym").value;
  log("$ tradingagents","mt","  demo · paper");
  log("✓ analysts 3","mt","researchers 2 · risk team 3 · PM 1");await sleep(z);
  log("technical","tc",`EMA9 ${bull?"above":"below"} EMA21 · RSI ${s.rsi.toFixed(1)}`);await sleep(z);
  log("volatility","vc",`ATR ${s.atr.toFixed(2)} · volume ${s.vr.toFixed(2)}x avg`);await sleep(z);
  log("structure","sc",`20-bar range ${fp(s.lo)} – ${fp(s.hi)}`);prog(0,100);await sleep(z);
  log("bull researcher","bu",bull?"trend and momentum aligned up":"range low holds · mean reversion");await sleep(z);
  log("bear researcher","be",bull?"overextended above EMA50":"liquidity below "+fp(s.lo)+" · magnet");prog(1,100);await sleep(z);
  const conf=.55+Math.min(.3,Math.abs(s.rsi-50)/100);
  log("trader","sc",`direction ${sell?"SELL":"BUY"} conf=${conf.toFixed(2)}`);await sleep(z);
  log("risk team","rm","aggressive ✓  neutral ✓  conservative ✗");prog(2,100);await sleep(z);
  log("portfolio mgr","bu","APPROVED · size 0.3x");await sleep(z/2);
  const e=s.last,k=s.atr;
  showDecision({action:sell?"SELL":"BUY",confidence:conf,entry:e,stop_loss:sell?e+1.5*k:e-1.5*k,take_profit:sell?e-2.5*k:e+2.5*k,rationale:"Demo decision from EMA trend with ATR-based stop and target. Not produced by an LLM."});
  log("agent graph done ✓","mt","demo · no tokens used");
}

/* ---------- wiring ---------- */
async function go(isDemo){
  if(S.busy)return;S.busy=true;$("#run").disabled=$("#demo").disabled=true;reset();
  try{
    if(!S.cs.length)await load();
    const key=$("#key").value.trim();
    if(isDemo||!key){if(!isDemo)log("note","mt","No API key entered, running the demo instead.");await demo()}
    else{try{localStorage.setItem("ta_key",key)}catch{}await live()}
  }catch(e){log("error","be",e.message||String(e))}
  S.busy=false;$("#run").disabled=$("#demo").disabled=false;
}
$("#run").onclick=()=>go(false);$("#demo").onclick=()=>go(true);
$("#tf").onchange=load;$("#sym").onchange=load;
addEventListener("resize",draw);
if(window.ResizeObserver)new ResizeObserver(draw).observe($("#cb"));
load().catch(e=>log("error","be",e.message));wlLoad();setInterval(wlLoad,20000);
</script>
</body>
</html>
