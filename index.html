<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingAgents-Lite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#070a12;--panel:#0d1220;--line:#1a2236;--tx:#d7deea;--mut:#7d889c;--up:#26d07c;--dn:#ff5c6c;--acc:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0 8px 0 0}h1 span{color:var(--acc)}
select,input,button{background:#111a2e;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input{flex:1;min-width:150px}
button{background:var(--acc);color:#04111f;font-weight:700;border:0;cursor:pointer}
button:disabled{opacity:.5}
main{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;padding:10px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
#chart{height:360px}
#term{height:420px;overflow-y:auto;padding:10px 12px;font:12px/1.5 ui-monospace,Menlo,monospace}
.ln{margin:0 0 8px;white-space:pre-wrap}
.ag{font-weight:700}
.t{color:#f5a623}.m{color:#b48cff}.s{color:#4da3ff}.bu{color:var(--up)}.be{color:var(--dn)}.r{color:#ffd166}.d{color:var(--mut)}
#dec{padding:12px;display:none}
#dec .act{font-size:26px;font-weight:800}
#dec .row{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0;color:var(--mut)}
#dec b{color:var(--tx)}
.note{padding:6px 12px 12px;color:var(--mut);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Trading<span>Agents</span>-Lite</h1>
  <select id="sym">
    <option value="PAXGUSDT">Gold (PAXG)</option>
    <option value="BTCUSDT">BTC</option>
    <option value="ETHUSDT">ETH</option>
  </select>
  <select id="tf">
    <option value="15m">15m</option>
    <option value="1h" selected>1h</option>
    <option value="4h">4h</option>
    <option value="1d">1d</option>
  </select>
  <input id="key" type="password" placeholder="Anthropic API key (stays in this browser)">
  <button id="run">Run agents</button>
</header>
<main>
  <div>
    <div class="card"><h2 id="ttl">Chart</h2><div id="chart"></div></div>
    <div class="card" style="margin-top:10px"><h2>Final decision</h2>
      <div id="dec"></div>
      <div class="note" id="decnote">Run the agents to get a decision.</div>
    </div>
  </div>
  <div class="card"><h2>Agent terminal</h2><div id="term"></div>
    <div class="note">Research and paper-trading only. Not financial advice.</div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const MODEL = "claude-sonnet-5-5";
const HOSTS = ["https://data-api.binance.vision", "https://api.binance.com"];
let chart, candle, sma20s, sma50s, priceLines = [];

$("#key").value = localStorage.getItem("ta_key") || "";

function initChart() {
  chart = LightweightCharts.createChart($("#chart"), {
    autoSize: true,
    layout: { background: { color: "#0d1220" }, textColor: "#7d889c" },
    grid: { vertLines: { color: "#151c2e" }, horzLines: { color: "#151c2e" } },
    timeScale: { timeVisible: true, borderColor: "#1a2236" },
    rightPriceScale: { borderColor: "#1a2236" }
  });
  candle = chart.addCandlestickSeries({ upColor: "#26d07c", downColor: "#ff5c6c", wickUpColor: "#26d07c", wickDownColor: "#ff5c6c", borderVisible: false });
  sma20s = chart.addLineSeries({ color: "#f5a623", lineWidth: 1, priceLineVisible: false });
  sma50s = chart.addLineSeries({ color: "#b48cff", lineWidth: 1, priceLineVisible: false });
}

async function getCandles(sym, tf) {
  let err;
  for (const h of HOSTS) {
    try {
      const r = await fetch(`${h}/api/v3/klines?symbol=${sym}&interval=${tf}&limit=200`);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return (await r.json()).map(k => ({ time: Math.floor(k[0] / 1000), open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5] }));
    } catch (e) { err = e; }
  }
  throw err;
}

const sma = (a, n) => a.map((_, i) => i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((x, y) => x + y, 0) / n);
function rsi(c, n = 14) {
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; d >= 0 ? g += d : l -= d; }
  g /= n; l /= n;
  for (let i = n + 1; i < c.length; i++) { const d = c[i] - c[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
function atr(cs, n = 14) {
  let a = 0;
  for (let i = 1; i < cs.length; i++) {
    const tr = Math.max(cs[i].high - cs[i].low, Math.abs(cs[i].high - cs[i - 1].close), Math.abs(cs[i].low - cs[i - 1].close));
    a = i <= n ? a + tr / n : (a * (n - 1) + tr) / n;
  }
  return a;
}

function drawChart(cs) {
  candle.setData(cs);
  const c = cs.map(x => x.close), t = cs.map(x => x.time);
  const line = arr => arr.map((v, i) => v == null ? null : { time: t[i], value: v }).filter(Boolean);
  sma20s.setData(line(sma(c, 20)));
  sma50s.setData(line(sma(c, 50)));
  chart.timeScale().fitContent();
}

function snapshot(sym, tf, cs) {
  const c = cs.map(x => x.close), last = cs[cs.length - 1], r20 = cs.slice(-20);
  const volAvg = cs.slice(-50).reduce((s, x) => s + x.volume, 0) / 50;
  const f = x => x.toFixed(2);
  return `Symbol ${sym} ${tf}
Close ${f(last.close)} | SMA20 ${f(sma(c, 20).at(-1))} | SMA50 ${f(sma(c, 50).at(-1))}
RSI14 ${f(rsi(c))} | ATR14 ${f(atr(cs))}
20-bar high ${f(Math.max(...r20.map(x => x.high)))} | low ${f(Math.min(...r20.map(x => x.low)))}
Last volume vs 50-bar avg: ${(last.volume / volAvg).toFixed(2)}x
Last 8 closes: ${c.slice(-8).map(f).join(", ")}`;
}

async function ask(system, user, max = 700) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": $("#key").value.trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: MODEL, max_tokens: max, system, messages: [{ role: "user", content: user }] })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || "API error " + r.status);
  return j.content.filter(b => b.type === "text").map(b => b.text).join("").trim();
}

function log(agent, cls, text) {
  const d = document.createElement("div");
  d.className = "ln";
  d.innerHTML = `<span class="ag ${cls}"></span><br><span></span>`;
  d.children[0].textContent = "▸ " + agent;
  d.children[2].textContent = text;
  $("#term").appendChild(d);
  $("#term").scrollTop = $("#term").scrollHeight;
}

const RULES = "Use only the data given; invent no numbers. Max 120 words. End with: Stance: BULLISH, BEARISH or NEUTRAL.";

async function run() {
  if (!$("#key").value.trim()) { alert("Paste your Anthropic API key first."); return; }
  localStorage.setItem("ta_key", $("#key").value.trim());
  $("#run").disabled = true; $("#term").innerHTML = ""; $("#dec").style.display = "none";
  priceLines.forEach(l => candle.removePriceLine(l)); priceLines = [];
  const sym = $("#sym").value, tf = $("#tf").value;
  try {
    log("desk", "d", `Loading ${sym} ${tf} candles...`);
    const cs = await getCandles(sym, tf);
    drawChart(cs);
    $("#ttl").textContent = `${sym} · ${tf}`;
    const snap = snapshot(sym, tf, cs);
    log("data", "d", snap);

    const mk = (name, cls, sys) => ask(`You are the ${sys}. ${RULES}`, snap).then(t => { log(name, cls, t); return t; });
    const [tech, vol, struct] = await Promise.all([
      mk("technical analyst", "t", "technical analyst: trend and momentum"),
      mk("volatility analyst", "m", "volatility and volume analyst"),
      mk("structure analyst", "s", "market-structure analyst: key levels, ranges, breakouts")
    ]);
    const brief = `TECH:\n${tech}\n\nVOL:\n${vol}\n\nSTRUCTURE:\n${struct}`;

    const bull = await ask("You are the bull researcher. Strongest evidence-based case to BUY. Max 110 words.", `${snap}\n\n${brief}`, 500);
    log("bull researcher", "bu", bull);
    const bear = await ask("You are the bear researcher. Strongest case to SELL or stay out; rebut the bull. Max 110 words.", `${snap}\n\n${brief}\n\nBULL:\n${bull}`, 500);
    log("bear researcher", "be", bear);
    const verdict = await ask("You are the research manager. Pick the more convincing side and name the 2 biggest risks. Max 110 words.", `${brief}\n\nBULL:\n${bull}\n\nBEAR:\n${bear}`, 500);
    log("research manager", "r", verdict);
    const plan = await ask("You are the trader. Give direction (BUY/SELL/HOLD), entry, stop loss, take profit, using ATR for distances. Max 100 words.", `${snap}\n\nVERDICT:\n${verdict}`, 500);
    log("trader", "t", plan);
    const risk = await Promise.all([
      ["aggressive", "favour the trade and bigger size"], ["neutral", "weigh reward vs risk evenly"], ["conservative", "prioritise capital protection"]
    ].map(([n, s]) => ask(`You are the ${n} risk analyst; you ${s}. Critique the plan in max 60 words.`, plan, 300).then(t => { log(n + " risk", "r", t); return n + ": " + t; })));

    const raw = await ask('You are the portfolio manager. Reply with ONLY JSON: {"action":"BUY|SELL|HOLD","confidence":0-1,"entry":number|null,"stop_loss":number|null,"take_profit":number|null,"rationale":"1-2 sentences"}', `PLAN:\n${plan}\n\nRISK:\n${risk.join("\n")}`, 400);
    let d; try { d = JSON.parse(raw.match(/\{[\s\S]*\}/)[0]); } catch { d = { action: "HOLD", confidence: 0, rationale: "Could not parse the reply; defaulting to HOLD." }; }
    log("portfolio manager", "bu", JSON.stringify(d, null, 2));
    showDecision(d);
  } catch (e) {
    log("error", "be", e.message);
  }
  $("#run").disabled = false;
}

function showDecision(d) {
  const a = String(d.action || "HOLD").toUpperCase();
  const col = a === "BUY" ? "var(--up)" : a === "SELL" ? "var(--dn)" : "var(--mut)";
  const n = v => v == null ? "–" : (+v).toFixed(2);
  $("#dec").innerHTML = `<div class="act" style="color:${col}">${a}</div>
    <div class="row"><span>Confidence <b>${Math.round((d.confidence || 0) * 100)}%</b></span><span>Entry <b>${n(d.entry)}</b></span><span>Stop <b>${n(d.stop_loss)}</b></span><span>Target <b>${n(d.take_profit)}</b></span></div>
    <div></div>`;
  $("#dec").lastElementChild.textContent = d.rationale || "";
  $("#dec").style.display = "block"; $("#decnote").style.display = "none";
  [["entry", "#4da3ff"], ["stop_loss", "#ff5c6c"], ["take_profit", "#26d07c"]].forEach(([k, color]) => {
    if (d[k] != null && !isNaN(d[k])) priceLines.push(candle.createPriceLine({ price: +d[k], color, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: k }));
  });
}

initChart();
getCandles($("#sym").value, $("#tf").value).then(drawChart).catch(() => {});
["sym", "tf"].forEach(id => $("#" + id).addEventListener("change", () => getCandles($("#sym").value, $("#tf").value).then(cs => { drawChart(cs); $("#ttl").textContent = `${$("#sym").value} · ${$("#tf").value}`; })));
$("#run").addEventListener("click", run);
</script>
</body>
</html>
